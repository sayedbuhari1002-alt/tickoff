name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (latest stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install SQLite library (used by the repository tests)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Prepare Android scaffold
        run: bash tool/prepare_android.sh

      - name: Get dependencies
        run: flutter pub get

      - name: Format Dart sources
        run: dart format .

      - name: Analyze (informational)
        run: flutter analyze
        continue-on-error: true

      # Test steps do not stop the APK build, so you always get an APK to try
      # if the app compiles. A final step turns the run red if any test failed.
      - name: Unit and widget tests
        id: app_tests
        run: flutter test test/unit test/widget
        continue-on-error: true

      - name: SQLite repository tests
        id: db_tests
        run: flutter test test/data
        continue-on-error: true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tickoff-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Fail the run if any test failed
        if: steps.app_tests.outcome == 'failure' || steps.db_tests.outcome == 'failure'
        run: |
          echo "APK was built, but at least one test step failed. See the test steps above."
          exit 1

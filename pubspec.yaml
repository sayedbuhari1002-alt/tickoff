name: tickoff_replacement
description: Offline Android habit tracker modelled on the supplied TickOff screenshots.
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

# Stage 4 local-only reminders and media attachments.
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  path: ^1.9.0
  sqflite: ^2.3.3
  uuid: ^4.4.0
  flutter_local_notifications: ^19.4.0
  flutter_timezone: ^4.1.1
  timezone: ^0.10.1
  image_picker: ^1.1.2
  record: ^6.1.2
  audioplayers: ^6.5.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
